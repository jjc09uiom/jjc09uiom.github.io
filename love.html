<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>给你的一段话 ❤️</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: black;
    color: white;
    font-family: "Helvetica Neue", sans-serif;
    text-align: center;
    overflow: hidden;
}
.container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
}
.fade-in {
    animation: fadeIn 2s ease-in forwards;
}
@keyframes fadeIn {
    from {opacity: 0;}
    to {opacity: 1;}
}
#text {
    font-size: 22px;
    margin-bottom: 20px;
    min-height: 60px;
}
img {
    width: 80%;
    border-radius: 15px;
    margin-top: 15px;
    display: none;
}
button {
    margin-top: 20px;
    padding: 10px 20px;
    border: none;
    border-radius: 20px;
    background: #ff4d6d;
    color: white;
    font-size: 16px;
    display: none;
    transition: transform 0.2s ease;
}
button:active {
    transform: scale(0.95);
}
.modal {
    display: flex;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    justify-content: center;
    align-items: center;
    z-index: 1000;
}
.modal-content {
    background: linear-gradient(135deg, #ff6b9d, #c44569);
    padding: 20px;
    border-radius: 20px;
    text-align: center;
    max-width: 300px;
    width: 85%;
    box-shadow: 0 8px 30px rgba(255,107,157,0.4);
}
.heart-icon {
    font-size: 40px;
    margin-bottom: 15px;
    animation: pulse 1s infinite;
}
@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
}
.modal-content h2 {
    margin: 0 0 15px 0;
    color: white;
    font-size: 18px;
}
.modal-content input {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    text-align: center;
    margin-bottom: 12px;
    box-sizing: border-box;
}
.modal-content button {
    display: inline-block;
    padding: 10px 25px;
    background: white;
    color: #c44569;
    border: none;
    border-radius: 20px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 8px;
    transition: transform 0.2s ease;
}
.modal-content button:hover {
    background: #ffe6eb;
}
.modal-content button:active {
    transform: scale(0.95);
}
.error-msg {
    color: #ffeb3b;
    font-size: 14px;
    display: none;
    margin-bottom: 10px;
}
.hint {
    margin-top: 15px;
    font-size: 12px;
    color: rgba(255,255,255,0.7);
}
canvas {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 1001;
}
.audio-control {
    position: fixed;
    bottom: 30px;
    right: 30px;
    font-size: 30px;
    cursor: pointer;
    z-index: 1000;
    transition: transform 0.2s ease, opacity 0.2s ease;
    display: none;
}
.audio-control.muted {
    opacity: 1;
}
.audio-control:not(.muted) {
    opacity: 0.4;
}
.audio-control:active {
    transform: scale(0.9);
}
.play-btn-fixed {
    position: fixed;
    bottom: 30px;
    right: 80px;
    font-size: 30px;
    cursor: pointer;
    z-index: 1000;
    transition: transform 0.2s ease, opacity 0.2s ease;
    display: none;
    background: none;
    border: none;
    padding: 0;
}
.play-btn-fixed:active {
    transform: scale(0.95);
}
@keyframes soundWave {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
}
.play-btn-fixed.playing {
    animation: soundWave 0.8s ease-in-out infinite;
}
</style>
</head>
<body>
<div class="container" style="opacity: 0;">
    <div id="text"></div>
    <!-- <img id="photo" src="img/photo.jpg"> -->
    <br>
    <button id="audioBtn">点我进入音频播放器 🎬</button>
</div>
<!-- 验证窗口 -->
<div id="verifyModal" class="modal">
    <div class="modal-content">
        <div class="heart-icon">❤️</div>
        <h2>请输入爱情密码</h2>
        <input type="text" id="passwordInput" placeholder="在这里输入...">
        <div id="errorMsg" class="error-msg">💔 密码错误哦，再想想～</div>
        <button id="submitBtn">确认 💕</button>
        <div class="hint">提示：这是一句甜甜的话 💬</div>
    </div>
</div>
<div class="container">
</div>
<audio id="audio" src="audio/kiss.mp3"></audio>
<div id="audioControl" class="audio-control muted">🔇</div>
<button id="playBtn" class="play-btn-fixed">🔊</button>
<canvas id="heartCanvas"></canvas>
<script>
const message = "遇见你之后，我才知道什么是心动 ❤️";

let index = 0;
const speed = 80;
const textEl = document.getElementById("text");
const audio = document.getElementById("audio");
function typeWriter() {
    if (index < message.length) {
        textEl.innerHTML += message.charAt(index) === "\n" ? "<br>" : message.charAt(index);
        index++;
        setTimeout(typeWriter, speed);
    } else {
        // 显示图片和按钮
        // document.getElementById("photo").style.display = "block";
        document.getElementById("audioBtn").style.display = "inline-block";
    }
}

// 音频控制 - 控制静音
const audioControl = document.getElementById('audioControl');
let isMuted = true;

audioControl.addEventListener('click', () => {
    isMuted = !isMuted;
    audio.muted = isMuted;
    audioControl.textContent = isMuted ? '🔇' : '🔊';
    if (isMuted) {
        audioControl.classList.add('muted');
    } else {
        audioControl.classList.remove('muted');
    }
});

// 播放按钮 - 从头开始播放
const playBtn = document.getElementById('playBtn');
let currentAudio = null;

playBtn.addEventListener('click', () => {
    if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
    }
    currentAudio = new Audio('audio/kiss.mp3');
    if (!audio.muted) {
        currentAudio.play().catch(() => {
            alert('无法播放音频，请检查文件是否存在。');
        });
        playBtn.classList.add('playing');
    }
    
    currentAudio.addEventListener('ended', () => {
        playBtn.classList.remove('playing');
    });
});
typeWriter();

// ❤️ 爱心粒子效果
const canvas = document.getElementById('heartCanvas');
const ctx = canvas.getContext('2d');

let particles = [];

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
// 创建爱心
function createHeart(x, y) {
    particles.push({
        x,
        y,
        size: Math.random() * 8 + 6,
        alpha: 1,
        vx: (Math.random() - 0.5) * 2,
        vy: -Math.random() * 2 - 1
    });
}
// 绘制爱心
function drawHeart(p) {
    ctx.save();
    ctx.globalAlpha = p.alpha;
    ctx.translate(p.x, p.y);
    ctx.scale(p.size / 10, p.size / 10);

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(0, -3, -5, -3, -5, 0);
    ctx.bezierCurveTo(-5, 3, 0, 5, 0, 7);
    ctx.bezierCurveTo(0, 5, 5, 3, 5, 0);
    ctx.bezierCurveTo(5, -3, 0, -3, 0, 0);
    ctx.fillStyle = '#ff4d6d';
    ctx.fill();

    ctx.restore();
}
// 爱心动画
function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    particles.forEach((p, i) => {
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.02;

        if (p.alpha <= 0) {
            particles.splice(i, 1);
        } else {
            drawHeart(p);
        }
    });

    requestAnimationFrame(animate);
}
animate();

// 点击 + 移动触发
function spawnHearts(e) {
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    const y = e.touches ? e.touches[0].clientY : e.clientY;

    for (let i = 0; i < 4; i++) {
        createHeart(x, y);
    }
}

window.addEventListener('click', spawnHearts);
window.addEventListener('mousemove', spawnHearts);
window.addEventListener('touchstart', spawnHearts);
window.addEventListener('touchmove', spawnHearts);

// 进入音频播放器
document.getElementById("audioBtn").onclick = () => {
    sessionStorage.setItem('fromLovePage', 'true');
    window.location.href = "audio-player.html";
};

// 正确密码
const correctPassword = "我爱你么么哒特";

// 密码验证
document.getElementById("submitBtn").onclick = () => {
    const input = document.getElementById("passwordInput").value;
    if (input === correctPassword) {
        alert("验证通过！");
        document.getElementById("verifyModal").style.display = "none";
        // 渐显主页面内容
        const container = document.querySelector('.container');
        container.style.transition = 'opacity 1s ease-in';
        container.style.opacity = '1';
        // 显示音频控制按钮和播放按钮
        document.getElementById('audioControl').style.display = 'block';
        document.getElementById('playBtn').style.display = 'block';
    } else {
        document.getElementById("errorMsg").style.display = "block";
    }
};
// 密码输入
document.getElementById("passwordInput").onkeypress = (e) => {
    if (e.key === "Enter") {
        document.getElementById("submitBtn").click();
    }
};
</script>
</body>
</html>
