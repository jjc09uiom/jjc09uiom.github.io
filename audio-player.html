<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音频播放器 ❤️</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: black;
    color: white;
    font-family: "Helvetica Neue", sans-serif;
    text-align: center;
}
.container {
    max-width: 800px;
    margin: 0 auto;
    padding: 40px 20px;
}
.header {
    margin-bottom: 40px;
}
.header h1 {
    font-size: 36px;
    color: #ff4d6d;
    margin-bottom: 10px;
}
.header p {
    font-size: 18px;
    color: rgba(255,255,255,0.7);
}
.upload-section {
    margin-bottom: 40px;
    padding: 30px;
    background: rgba(255,77,109,0.1);
    border-radius: 20px;
    border: 2px dashed #ff4d6d;
}
.upload-section h2 {
    font-size: 24px;
    margin-bottom: 20px;
    color: #ff4d6d;
}
.upload-btn {
    padding: 15px 30px;
    border: none;
    border-radius: 25px;
    background: #ff4d6d;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s ease, background 0.2s ease;
}
.upload-btn:hover {
    background: #ff3355;
}
.upload-btn:active {
    transform: scale(0.95);
}
#fileInput {
    display: none;
}
.audio-list {
    margin-top: 40px;
}
.audio-list h2 {
    font-size: 24px;
    margin-bottom: 20px;
    color: #ff4d6d;
}
.audio-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px;
    background: rgba(255,255,255,0.1);
    border-radius: 15px;
    margin-bottom: 15px;
    transition: background 0.3s ease;
}
.audio-item:hover {
    background: rgba(255,255,255,0.15);
}
.audio-info {
    flex: 1;
    text-align: left;
}
.audio-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 5px;
}
.audio-size {
    font-size: 14px;
    color: rgba(255,255,255,0.6);
}
.audio-actions {
    display: flex;
    gap: 10px;
}
.play-btn, .delete-btn {
    padding: 10px 20px;
    border: none;
    border-radius: 20px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s ease;
}
.play-btn {
    background: #4CAF50;
    color: white;
}
.delete-btn {
    background: #f44336;
    color: white;
}
.play-btn:active, .delete-btn:active {
    transform: scale(0.95);
}
.back-btn {
    position: fixed;
    top: 20px;
    left: 20px;
    padding: 10px 20px;
    border: none;
    border-radius: 20px;
    background: rgba(255,255,255,0.2);
    color: white;
    font-size: 14px;
    cursor: pointer;
    transition: transform 0.2s ease, background 0.2s ease;
}
.back-btn:hover {
    background: rgba(255,255,255,0.3);
}
.back-btn:active {
    transform: scale(0.95);
}
.success-msg {
    position: fixed;
    top: 20px;
    right: 20px;
    background: #4CAF50;
    color: white;
    padding: 15px 25px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: bold;
    z-index: 1000;
    display: none;
    animation: slideIn 0.3s ease;
}
@keyframes slideIn {
    from {
        transform: translateX(100%);
        opacity: 0;
    }
    to {
        transform: translateX(0);
        opacity: 1;
    }
}
.note {
    margin-top: 20px;
    padding: 15px;
    background: rgba(255,77,109,0.1);
    border-radius: 10px;
    font-size: 14px;
    color: rgba(255,255,255,0.7);
}
</style>
</head>
<body>
<button class="back-btn" onclick="window.location.href='love.html'">← 返回</button>

<div class="container">
    <div class="header">
        <h1>🎵 音频播放器</h1>
        <p>上传和管理你的音频文件</p>
    </div>

    <div class="upload-section">
        <h2>上传音频</h2>
        <input type="file" id="fileInput" accept=".mp3">
        <button class="upload-btn" onclick="document.getElementById('fileInput').click()">📁 选择MP3文件</button>
        <div class="note">💡 提示：上传的音频仅在当前会话有效，如需永久保存请将文件手动添加到 audio 文件夹</div>
    </div>

    <div class="audio-list">
        <h2>音频列表</h2>
        <div id="audioList"></div>
    </div>
</div>

<div id="successMsg" class="success-msg"></div>

<script>
(function checkRedirect() {
    const fromRedirect = sessionStorage.getItem('fromLovePage');
    if (!fromRedirect) {
        window.location.href = 'love.html';
        return;
    }
    sessionStorage.removeItem('fromLovePage');
})();

let audioFiles = [];
let blobUrls = {};
let currentPlayer = null;
let currentPlayingIndex = -1;

function init() {
    loadAudioFiles();
    setupEventListeners();
}

function loadAudioFiles() {
    const saved = localStorage.getItem('audioFiles');
    if (saved) {
        audioFiles = JSON.parse(saved);
    } else {
        audioFiles = [
            { name: 'sing01.mp3', size: '2.5MB', isLocal: true }
        ];
    }
    renderAudioList();
}

function setupEventListeners() {
    document.getElementById('fileInput').addEventListener('change', handleFileUpload);
}

function handleFileUpload(e) {
    const file = e.target.files[0];
    if (file) {
        if (file.type === 'audio/mpeg' || file.name.endsWith('.mp3')) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const blobUrl = URL.createObjectURL(file);
                blobUrls[file.name] = blobUrl;

                const newAudio = {
                    name: file.name,
                    size: formatFileSize(file.size),
                    isLocal: true
                };
                audioFiles.push(newAudio);
                saveAudioFiles();
                renderAudioList();
                showSuccessMessage('音频上传成功！');
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        } else {
            alert('请选择MP3格式的音频文件！');
        }
    }
}

function formatFileSize(bytes) {
    if (bytes < 1024) return bytes + 'B';
    else if (bytes < 1048576) return (bytes / 1024).toFixed(1) + 'KB';
    else return (bytes / 1048576).toFixed(1) + 'MB';
}

function deleteAudio(index) {
    if (confirm('确定要删除这个音频文件吗？')) {
        if (index === currentPlayingIndex) {
            if (currentPlayer) {
                currentPlayer.pause();
                currentPlayer = null;
                currentPlayingIndex = -1;
            }
        }
        const audio = audioFiles[index];
        if (audio.isLocal && blobUrls[audio.name]) {
            URL.revokeObjectURL(blobUrls[audio.name]);
            delete blobUrls[audio.name];
        }
        audioFiles.splice(index, 1);
        saveAudioFiles();
        renderAudioList();
        showSuccessMessage('音频删除成功！');
    }
}

function togglePlay(index) {
    const audio = audioFiles[index];
    
    if (currentPlayer && currentPlayingIndex === index) {
        if (!currentPlayer.paused) {
            currentPlayer.pause();
        } else {
            currentPlayer.play();
        }
        renderAudioList();
        return;
    }
    
    if (currentPlayer) {
        currentPlayer.pause();
    }
    
    if (audio.isLocal && blobUrls[audio.name]) {
        currentPlayer = new Audio(blobUrls[audio.name]);
    } else {
        currentPlayer = new Audio(`audio/${audio.name}`);
    }
    
    currentPlayer.play().catch(() => {
        alert('无法播放音频，请检查文件是否存在。');
        currentPlayer = null;
        currentPlayingIndex = -1;
        renderAudioList();
    });
    
    currentPlayer.addEventListener('ended', function() {
        currentPlayingIndex = -1;
        currentPlayer = null;
        renderAudioList();
    });
    
    currentPlayingIndex = index;
    renderAudioList();
}

function saveAudioFiles() {
    const toSave = audioFiles.filter(a => a.isLocal);
    localStorage.setItem('audioFiles', JSON.stringify(toSave));
}

function renderAudioList() {
    const audioList = document.getElementById('audioList');
    if (audioFiles.length === 0) {
        audioList.innerHTML = '<p style="color: rgba(255,255,255,0.6);">暂无音频文件</p>';
        return;
    }

    let html = '';
    for (let i = 0; i < audioFiles.length; i++) {
        const audio = audioFiles[i];
        const isPlaying = currentPlayingIndex === i && currentPlayer && !currentPlayer.paused;
        const isPaused = currentPlayingIndex === i && currentPlayer && currentPlayer.paused;
        let playBtnText = '▶ 播放';
        
        if (isPlaying) {
            playBtnText = '⏸ 暂停';
        } else if (isPaused) {
            playBtnText = '▶ 继续';
        }
        
        html += `
            <div class="audio-item">
                <div class="audio-info">
                    <div class="audio-title">🎵 ${audio.name} ${audio.isLocal ? '(本地)' : ''}</div>
                    <div class="audio-size">${audio.size}</div>
                </div>
                <div class="audio-actions">
                    <button class="play-btn" onclick="togglePlay(${i})"></button>
                    ${audio.isLocal ? `<button class="delete-btn" onclick="deleteAudio(${i})"></button>` : ''}
                </div>
            </div>
        `;
    }
    audioList.innerHTML = html;
    
    // 更新按钮文本
    const playButtons = document.querySelectorAll('.play-btn');
    playButtons.forEach((btn, index) => {
        const audio = audioFiles[index];
        const isPlaying = currentPlayingIndex === index && currentPlayer && !currentPlayer.paused;
        const isPaused = currentPlayingIndex === index && currentPlayer && currentPlayer.paused;
        let playBtnText = '▶ 播放';
        
        if (isPlaying) {
            playBtnText = '⏸ 暂停';
        } else if (isPaused) {
            playBtnText = '▶ 继续';
        }
        btn.textContent = playBtnText;
    });
    
    const deleteButtons = document.querySelectorAll('.delete-btn');
    deleteButtons.forEach(btn => {
        btn.textContent = '🗑️ 删除';
    });
}

function showSuccessMessage(message) {
    const successMsg = document.getElementById('successMsg');
    successMsg.textContent = message;
    successMsg.style.display = 'block';

    setTimeout(() => {
        successMsg.style.display = 'none';
    }, 3000);
}

init();
</script>
</body>
</html>
