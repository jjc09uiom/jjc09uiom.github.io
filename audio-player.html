<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>音频播放器 ❤️</title>

<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    padding: 0;
    background: black;
    color: white;
    font-family: "Helvetica Neue", sans-serif;
    text-align: center;
}
.container {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px 15px;
}
.header {
    margin-bottom: 30px;
}
.header h1 {
    font-size: 28px;
    color: #ff4d6d;
    margin-bottom: 10px;
}
.header p {
    font-size: 16px;
    color: rgba(255,255,255,0.7);
}
.upload-section {
    margin-bottom: 30px;
    padding: 20px;
    background: rgba(255,77,109,0.1);
    border-radius: 15px;
    border: 2px dashed #ff4d6d;
}
.upload-section h2 {
    font-size: 20px;
    margin-bottom: 15px;
    color: #ff4d6d;
}
.upload-btn {
    padding: 12px 24px;
    border: none;
    border-radius: 20px;
    background: #ff4d6d;
    color: white;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s ease, background 0.2s ease;
}
.upload-btn:hover {
    background: #ff3355;
}
.upload-btn:active {
    transform: scale(0.95);
}
#fileInput {
    display: none;
}
.audio-list {
    margin-top: 30px;
}
.audio-list h2 {
    font-size: 20px;
    margin-bottom: 15px;
    color: #ff4d6d;
}
.audio-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px;
    background: rgba(255,255,255,0.1);
    border-radius: 12px;
    margin-bottom: 12px;
    transition: background 0.3s ease;
}
.audio-item:hover {
    background: rgba(255,255,255,0.15);
}
.audio-info {
    flex: 1;
    text-align: left;
    min-width: 0;
}
.audio-title {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.audio-size {
    font-size: 12px;
    color: rgba(255,255,255,0.6);
}
.audio-actions {
    display: flex;
    gap: 8px;
}
.play-btn, .delete-btn {
    padding: 8px 16px;
    border: none;
    border-radius: 16px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s ease;
}
.play-btn {
    background: #4CAF50;
    color: white;
}
.delete-btn {
    background: #f44336;
    color: white;
}
.delete-btn:disabled {
    background: #555;
    color: #aaa;
    cursor: not-allowed;
}
.play-btn:active, .delete-btn:active:not(:disabled) {
    transform: scale(0.95);
}
.back-btn {
    position: fixed;
    top: 15px;
    left: 15px;
    padding: 8px 16px;
    border: none;
    border-radius: 16px;
    background: rgba(255,255,255,0.2);
    color: white;
    font-size: 12px;
    cursor: pointer;
    transition: transform 0.2s ease, background 0.2s ease;
    z-index: 1000;
}
.back-btn:hover {
    background: rgba(255,255,255,0.3);
}
.back-btn:active {
    transform: scale(0.95);
}
.success-msg {
    position: fixed;
    top: 15px;
    right: 15px;
    background: #4CAF50;
    color: white;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: bold;
    z-index: 1000;
    display: none;
    animation: slideIn 0.3s ease;
}
@keyframes slideIn {
    from {
        transform: translateX(100%);
        opacity: 0;
    }
    to {
        transform: translateX(0);
        opacity: 1;
    }
}
.note {
    margin-top: 15px;
    padding: 12px;
    background: rgba(255,77,109,0.1);
    border-radius: 8px;
    font-size: 12px;
    color: rgba(255,255,255,0.7);
}

/* 响应式设计 */
@media (max-width: 480px) {
    .container {
        padding: 15px 10px;
    }
    .header h1 {
        font-size: 24px;
    }
    .audio-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
    }
    .audio-actions {
        align-self: flex-end;
    }
    .play-btn, .delete-btn {
        padding: 6px 12px;
        font-size: 11px;
    }
}
</style>
</head>
<body>
<button class="back-btn" onclick="window.location.href='love.html'">← 返回</button>

<div class="container">
    <div class="header">
        <h1>🎵 钧钧珊珊🐷の音频播放器</h1>
        <p>上传和管理我们的音频文件</p>
    </div>

    <div class="upload-section">
        <h2>上传音频</h2>
        <input type="file" id="fileInput" accept=".mp3">
        <button class="upload-btn" onclick="document.getElementById('fileInput').click()">📁 选择MP3文件</button>
        <div class="note">💡 提示：目前需要科学上网才能稳定上传音频文件哦~</div>
    </div>

    <div class="audio-list">
        <h2>音频列表</h2>
        <div id="audioList"></div>
    </div>
</div>

<div id="successMsg" class="success-msg"></div>

<script>
(function checkRedirect() {
    const fromRedirect = sessionStorage.getItem('fromLovePage');
    if (!fromRedirect) {
        window.location.href = 'love.html';
        return;
    }
    sessionStorage.removeItem('fromLovePage');
})();

// --- R2 Worker 配置 ---
// 请将此处替换为你部署好的 Worker 域名，例如：https://audio-manager.your-subdomain.workers.dev
const WORKER_URL = 'https://audio-manager.jjc09uiom.workers.dev'; 

let audioFiles = [];
let currentPlayer = null;
let currentPlayingIndex = -1;

async function init() {
    setupEventListeners();
    await fetchAudioList();
}

async function fetchAudioList() {
    try {
        const res = await fetch(`${WORKER_URL}/list`);
        if (!res.ok) throw new Error('无法获取列表');
        const data = await res.json();
        
        // 转换 R2 数据格式为页面所需的格式
        // uploaded 字段格式：2024-01-15T08:30:00.000Z
        audioFiles = data.map(item => {
            const uploadedDate = new Date(item.uploaded);
            const formattedDate = formatUploadTime(uploadedDate);
            return {
                name: item.key,
                displayName: item.key,
                size: formatFileSize(item.size),
                uploaded: item.uploaded, // 原始时间戳，用于排序
                uploadedFormatted: formattedDate, // 格式化后显示 yyyy-mm-dd,h:m:s
                isR2: true
            };
        });
        
        // 按上传时间正序排序（最老的在前）
        audioFiles.sort((a, b) => new Date(a.uploaded) - new Date(b.uploaded));
        
        renderAudioList();
    } catch (e) {
        console.error('获取列表失败:', e);
        // 如果失败，显示空列表或尝试从本地加载（可选）
        audioFiles = [];
        renderAudioList();
    }
}

function setupEventListeners() {
    document.getElementById('fileInput').addEventListener('change', handleFileUpload);
}

async function handleFileUpload(e) {
    const file = e.target.files[0];
    if (!file) return;

    if (!(file.type === 'audio/mpeg' || file.name.endsWith('.mp3'))) {
        alert('请选择MP3格式的音频文件！');
        return;
    }

    // --- 本地重名检查 ---
    const isDuplicate = audioFiles.some(f => f.name === file.name);
    if (isDuplicate) {
        alert(`文件 "${file.name}" 已存在于云端，请勿重复上传。`);
        e.target.value = '';
        return;
    }

    const formData = new FormData();
    formData.append('file', file);

    showSuccessMessage('正在上传到云端...');

    try {
        const res = await fetch(`${WORKER_URL}/upload`, {
            method: 'POST',
            body: formData
        });

        if (res.status === 409) {
            const errorData = await res.json();
            alert(errorData.error || '文件已存在');
            return;
        }

        if (!res.ok) throw new Error('上传失败');
        
        const result = await res.json();
        if (result.success) {
            showSuccessMessage('音频上传成功！');
            await fetchAudioList(); 
        }
    } catch (e) {
        console.error('上传出错:', e);
        alert('上传失败，请检查网络连接');
    } finally {
        e.target.value = '';
    }
}

function formatFileSize(bytes) {
    if (!bytes) return '未知大小';
    if (bytes < 1024) return bytes + 'B';
    else if (bytes < 1048576) return (bytes / 1024).toFixed(1) + 'KB';
    else return (bytes / 1048576).toFixed(1) + 'MB';
}

function formatUploadTime(date) {
    const yyyy = date.getFullYear();
    const mm = String(date.getMonth() + 1).padStart(2, '0');
    const dd = String(date.getDate()).padStart(2, '0');
    const h = String(date.getHours()).padStart(2, '0');
    const m = String(date.getMinutes()).padStart(2, '0');
    const s = String(date.getSeconds()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd},${h}:${m}:${s}`;
}

async function deleteAudio(index) {
    const audio = audioFiles[index];
    if (!confirm(`确定要从云端彻底删除 "${audio.name}" 吗？`)) return;

    try {
        const res = await fetch(`${WORKER_URL}/delete`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ key: audio.name })
        });

        if (!res.ok) throw new Error('删除失败');

        const result = await res.json();
        if (result.success) {
            if (index === currentPlayingIndex && currentPlayer) {
                currentPlayer.pause();
                currentPlayer = null;
                currentPlayingIndex = -1;
            }
            showSuccessMessage('音频已从云端删除');
            await fetchAudioList();
        }
    } catch (e) {
        console.error('删除出错:', e);
        alert('删除失败');
    }
}

function togglePlay(index) {
    const audio = audioFiles[index];
    
    if (currentPlayer && currentPlayingIndex === index) {
        if (!currentPlayer.paused) {
            currentPlayer.pause();
        } else {
            currentPlayer.play();
        }
        renderAudioList();
        return;
    }
    
    if (currentPlayer) {
        currentPlayer.pause();
    }
    
    // 使用 Worker 的 /url 接口获取播放地址
    const audioUrl = `${WORKER_URL}/url?key=${encodeURIComponent(audio.name)}`;
    currentPlayer = new Audio(audioUrl);
    
    currentPlayer.play().catch((err) => {
        console.error('播放失败:', err);
        alert('无法播放音频，可能是文件链接失效或 Worker 权限问题。');
        currentPlayer = null;
        currentPlayingIndex = -1;
        renderAudioList();
    });
    
    currentPlayer.addEventListener('ended', function() {
        currentPlayingIndex = -1;
        currentPlayer = null;
        renderAudioList();
    });
    
    currentPlayingIndex = index;
    renderAudioList();
}

function renderAudioList() {
    const audioList = document.getElementById('audioList');
    if (audioFiles.length === 0) {
        audioList.innerHTML = '<p style="color: rgba(255,255,255,0.6);">云端暂无音频文件，快去上传吧</p>';
        return;
    }

    let html = '';
    for (let i = 0; i < audioFiles.length; i++) {
        const audio = audioFiles[i];
        const isPlaying = currentPlayingIndex === i && currentPlayer && !currentPlayer.paused;
        const isPaused = currentPlayingIndex === i && currentPlayer && currentPlayer.paused;
        let playBtnText = isPlaying ? '⏸ 暂停' : (isPaused ? '▶ 继续' : '▶ 播放');
        
        html += `
            <div class="audio-item">
                <div class="audio-info">
                    <div class="audio-title"><span style="color:#ff4d6d;font-weight:bold;">${i + 1}.</span> 🎵 ${audio.displayName}</div>
                    <div class="audio-size">${audio.size} &nbsp;|&nbsp; 上传时间：${audio.uploadedFormatted}</div>
                </div>
                <div class="audio-actions">
                    <button class="play-btn" onclick="togglePlay(${i})">${playBtnText}</button>
                    <button class="delete-btn" onclick="deleteAudio(${i})">🗑️ 删除</button>
                </div>
            </div>
        `;
    }
    audioList.innerHTML = html;
}

function showSuccessMessage(message) {
    const successMsg = document.getElementById('successMsg');
    successMsg.textContent = message;
    successMsg.style.display = 'block';

    setTimeout(() => {
        successMsg.style.display = 'none';
    }, 3000);
}

init();
</script>
</body>
</html>
