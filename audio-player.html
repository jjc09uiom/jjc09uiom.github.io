<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="dns-prefetch" href="//api.cj0421.site">
<link rel="preconnect" href="https://api.cj0421.site" crossorigin>
<title>音频播放器 ❤️</title>

<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    padding: 0;
    background: black;
    color: white;
    font-family: "Helvetica Neue", sans-serif;
    text-align: center;
}
.container {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px 15px;
}
.header {
    margin-bottom: 30px;
}
.header h1 {
    font-size: 28px;
    color: #ff4d6d;
    margin-bottom: 10px;
}
.header p {
    font-size: 16px;
    color: rgba(255,255,255,0.7);
}
.upload-section {
    margin-bottom: 30px;
    padding: 20px;
    background: rgba(255,77,109,0.1);
    border-radius: 15px;
    border: 2px dashed #ff4d6d;
}
.upload-section h2 {
    font-size: 20px;
    margin-bottom: 15px;
    color: #ff4d6d;
}
.upload-btn {
    padding: 12px 24px;
    border: none;
    border-radius: 20px;
    background: #ff4d6d;
    color: white;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s ease, background 0.2s ease;
}
.upload-btn:hover {
    background: #ff3355;
}
.upload-btn:active {
    transform: scale(0.95);
}
#fileInput {
    display: none;
}
.audio-list {
    margin-top: 30px;
}
.list-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    flex-wrap: wrap;
    gap: 10px;
}
.list-header h2 {
    font-size: 20px;
    margin: 0;
    color: #ff4d6d;
}
.search-container {
    display: flex;
    align-items: center;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 5px 15px;
    gap: 8px;
    border: 1px solid rgba(255, 77, 109, 0.3);
}
.search-icon {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.6);
}
.search-input {
    background: none;
    border: none;
    color: white;
    font-size: 14px;
    outline: none;
    width: 120px;
}
.search-btn {
    background: #ff4d6d;
    color: white;
    border: none;
    border-radius: 15px;
    padding: 4px 12px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.2s, transform 0.2s ease;
}
.search-btn:hover {
    background: #ff3355;
    transform: scale(1.05);
}
.search-btn:active {
    transform: scale(0.9);
}
.reset-btn {
    background: none;
    border: none;
    color: rgba(255, 255, 255, 0.6);
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s ease, color 0.2s;
    padding: 0;
}
.reset-btn:hover {
    color: #ff4d6d;
    transform: scale(1.2);
}
.reset-btn:active {
    transform: scale(0.9);
}
#audioList {
    background: rgba(255, 255, 255, 0.05);
    border-radius: 12px;
    padding: 15px;
    height: 450px; /* 固定高度，容纳 5 条音频 + 没有更多了 */
    overflow: hidden; /* 不支持滚动 */
    border: 1px solid rgba(255, 77, 109, 0.2);
    position: relative;
    text-align: left;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
}
.no-more {
    text-align: center;
    color: rgba(255, 255, 255, 0.4);
    font-size: 13px;
    padding: 12px 0;
    margin-top: auto; /* 始终吸附在底部 */
    border-top: 1px dashed rgba(255, 255, 255, 0.1);
}
.pagination-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin-top: 20px;
    padding: 10px;
    background: rgba(255, 77, 109, 0.1);
    border-radius: 25px;
}
.page-btn {
    background: none;
    border: none;
    color: #ff4d6d;
    font-size: 24px;
    cursor: pointer;
    transition: transform 0.2s ease, opacity 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
}
.page-btn:hover:not(:disabled) {
    transform: scale(1.3);
}
.page-btn:active:not(:disabled) {
    transform: scale(0.9);
}
.page-btn:disabled {
    color: rgba(255, 255, 255, 0.2);
    cursor: not-allowed;
}
.page-info {
    font-size: 14px;
    color: white;
    font-weight: bold;
    min-width: 80px;
}
.audio-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 8px;
    margin-bottom: 10px;
    transition: background 0.2s;
    height: 64px; /* 固定单条高度，确保 5 条高度一致 */
    box-sizing: border-box;
}
.audio-item:last-of-type {
    margin-bottom: 0;
}
.audio-item:hover {
    background: rgba(255,255,255,0.15);
}
.audio-info {
    flex: 1;
    text-align: left;
    min-width: 0;
}
.audio-title {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.audio-size {
    font-size: 12px;
    color: rgba(255,255,255,0.6);
}
.audio-actions {
    display: flex;
    gap: 8px;
}
.play-btn, .delete-btn {
    padding: 8px 16px;
    border: none;
    border-radius: 16px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s ease;
}
.play-btn {
    background: #4CAF50;
    color: white;
}
.delete-btn {
    background: #f44336;
    color: white;
}
.delete-btn:disabled {
    background: #555;
    color: #aaa;
    cursor: not-allowed;
}
.play-btn:active, .delete-btn:active:not(:disabled) {
    transform: scale(0.95);
}
.back-btn {
    position: fixed;
    top: 15px;
    left: 15px;
    padding: 8px 16px;
    border: none;
    border-radius: 16px;
    background: rgba(255,255,255,0.2);
    color: white;
    font-size: 12px;
    cursor: pointer;
    transition: transform 0.2s ease, background 0.2s ease;
    z-index: 1000;
}
.back-btn:hover {
    background: rgba(255,255,255,0.3);
}
.back-btn:active {
    transform: scale(0.95);
}
.success-msg {
    position: fixed;
    top: 15px;
    right: 15px;
    background: #4CAF50;
    color: white;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: bold;
    z-index: 1000;
    display: none;
    animation: slideIn 0.3s ease;
}
@keyframes slideIn {
    from {
        transform: translateX(100%);
        opacity: 0;
    }
    to {
        transform: translateX(0);
        opacity: 1;
    }
}
.note {
    margin-top: 15px;
    padding: 12px;
    background: rgba(255,77,109,0.1);
    border-radius: 8px;
    font-size: 12px;
    color: rgba(255,255,255,0.7);
}

/* 响应式设计 */
@media (max-width: 480px) {
    .container {
        padding: 15px 10px;
    }
    .header h1 {
        font-size: 24px;
    }
    .audio-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
    }
    .audio-actions {
        align-self: flex-end;
    }
    .play-btn, .delete-btn {
        padding: 6px 12px;
        font-size: 11px;
    }
}
</style>
</head>
<body>
<button class="back-btn" onclick="window.location.href='love.html'">← 返回</button>

<div class="container">
    <div class="header">
        <h1>🎵 钧钧珊珊🐷の音频播放器</h1>
        <p>上传和管理我们的音乐~</p>
    </div>

    <div class="upload-section">
        <h2>上传音频</h2>
        <input type="file" id="fileInput" accept=".mp3">
        <button class="upload-btn" onclick="document.getElementById('fileInput').click()">📁 选择MP3文件</button>
        <div class="note">💡 提示：有问题联系老公大人哦~</div>
    </div>

    <div class="audio-list">
        <div class="list-header">
            <h2>音频列表</h2>
            <div style="display: flex; align-items: center; gap: 10px;">
                <div class="search-container">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" class="search-input" placeholder="搜索音频...">
                    <button id="searchBtn" class="search-btn">搜索</button>
                </div>
                <button id="resetBtn" class="reset-btn" title="重置列表">↻</button>
            </div>
        </div>
        <div id="audioList"></div>
        <div class="pagination-bar">
            <button id="prevPage" class="page-btn" title="上一页">◀</button>
            <div id="pageInfo" class="page-info">1 / 1</div>
            <button id="nextPage" class="page-btn" title="下一页">▶</button>
        </div>
    </div>
</div>

<div id="successMsg" class="success-msg"></div>

<script>
(function checkRedirect() {
    const fromRedirect = sessionStorage.getItem('fromLovePage');
    if (!fromRedirect) {
        window.location.href = 'love.html';
        return;
    }
    sessionStorage.removeItem('fromLovePage');
})();

// --- R2 Worker 配置 ---
// 请将此处替换为你部署好的 Worker 自定义域名（无需科学上网）
const WORKER_URL = 'http://api.cj0421.site'; 

let audioFiles = [];
let filteredFiles = []; // 当前页展示的文件
let currentPlayer = null;
let currentPlayingIndex = -1;

// 分页状态
let currentPage = 1;
const pageSize = 5;
let totalPages = 1;

async function init() {
    setupEventListeners();
    await fetchAudioList();
}

async function fetchAudioList() {
    try {
        const searchQuery = document.getElementById('searchInput').value.trim();
        const url = new URL(`${WORKER_URL}/list`);
        url.searchParams.append('page', currentPage);
        url.searchParams.append('limit', pageSize);
        if (searchQuery) {
            url.searchParams.append('search', searchQuery);
        }

        // 添加超时和重试机制，应对手机自带浏览器的网络抖动
        const fetchWithRetry = async (targetUrl, retries = 2) => {
            try {
                const response = await fetch(targetUrl, { mode: 'cors' });
                if (!response.ok) throw new Error('Network response was not ok');
                return response;
            } catch (err) {
                if (retries > 0) {
                    console.log(`正在重试... 剩余次数: ${retries}`);
                    return fetchWithRetry(targetUrl, retries - 1);
                }
                throw err;
            }
        };

        const res = await fetchWithRetry(url.toString());
        const data = await res.json();
        
        // 更新分页信息
        totalPages = data.totalPages || 1;
        currentPage = data.currentPage || 1;
        
        // 转换 R2 数据格式
        filteredFiles = data.items.map(item => {
            const uploadedDate = new Date(item.uploaded);
            const formattedDate = formatUploadTime(uploadedDate);
            return {
                name: item.key,
                displayName: item.key,
                size: formatFileSize(item.size),
                uploaded: item.uploaded,
                uploadedFormatted: formattedDate,
                isR2: true
            };
        });
        
        renderAudioList();
        updatePaginationUI();
    } catch (e) {
        console.error('获取列表失败:', e);
        filteredFiles = [];
        renderAudioList();
    }
}

function updatePaginationUI() {
    document.getElementById('pageInfo').textContent = `${currentPage} / ${totalPages}`;
    document.getElementById('prevPage').disabled = currentPage <= 1;
    document.getElementById('nextPage').disabled = currentPage >= totalPages;
}

function setupEventListeners() {
    document.getElementById('fileInput').addEventListener('change', handleFileUpload);
    
    // 搜索
    document.getElementById('searchBtn').addEventListener('click', () => {
        currentPage = 1; // 搜索时重置到第一页
        fetchAudioList();
    });
    
    // 还原
    document.getElementById('resetBtn').addEventListener('click', () => {
        document.getElementById('searchInput').value = '';
        currentPage = 1;
        fetchAudioList();
    });
    
    // 回车搜索
    document.getElementById('searchInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            currentPage = 1;
            fetchAudioList();
        }
    });

    // 分页按钮
    document.getElementById('prevPage').addEventListener('click', () => {
        if (currentPage > 1) {
            currentPage--;
            fetchAudioList();
        }
    });

    document.getElementById('nextPage').addEventListener('click', () => {
        if (currentPage < totalPages) {
            currentPage++;
            fetchAudioList();
        }
    });
}

function handleSearch() {
    // 该函数已被 fetchAudioList 内部逻辑替代，但为了兼容旧代码暂留或重定向
    currentPage = 1;
    fetchAudioList();
}

function handleReset() {
    document.getElementById('searchInput').value = '';
    currentPage = 1;
    fetchAudioList();
}

async function handleFileUpload(e) {
    const file = e.target.files[0];
    if (!file) return;

    if (!(file.type === 'audio/mpeg' || file.name.endsWith('.mp3'))) {
        alert('请选择MP3格式的音频文件！');
        return;
    }

    // --- 本地重名检查 ---
    const isDuplicate = audioFiles.some(f => f.name === file.name);
    if (isDuplicate) {
        alert(`文件 "${file.name}" 已存在于云端，请勿重复上传。`);
        e.target.value = '';
        return;
    }

    const formData = new FormData();
    formData.append('file', file);

    showSuccessMessage('正在上传到云端...');

    try {
        const res = await fetch(`${WORKER_URL}/upload`, {
            method: 'POST',
            body: formData
        });

        if (res.status === 409) {
            const errorData = await res.json();
            alert(errorData.error || '文件已存在');
            return;
        }

        if (!res.ok) throw new Error('上传失败');
        
        const result = await res.json();
        if (result.success) {
            showSuccessMessage('音频上传成功！');
            await fetchAudioList(); 
        }
    } catch (e) {
        console.error('上传出错:', e);
        alert('上传失败，请检查网络连接');
    } finally {
        e.target.value = '';
    }
}

function formatFileSize(bytes) {
    if (!bytes) return '未知大小';
    if (bytes < 1024) return bytes + 'B';
    else if (bytes < 1048576) return (bytes / 1024).toFixed(1) + 'KB';
    else return (bytes / 1048576).toFixed(1) + 'MB';
}

function formatUploadTime(date) {
    const yyyy = date.getFullYear();
    const mm = String(date.getMonth() + 1).padStart(2, '0');
    const dd = String(date.getDate()).padStart(2, '0');
    const h = String(date.getHours()).padStart(2, '0');
    const m = String(date.getMinutes()).padStart(2, '0');
    const s = String(date.getSeconds()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd},${h}:${m}:${s}`;
}

async function deleteAudio(index) {
    const audio = filteredFiles[index];
    if (!confirm(`确定要从云端彻底删除 "${audio.name}" 吗？`)) return;

    try {
        const res = await fetch(`${WORKER_URL}/delete`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ key: audio.name })
        });

        if (!res.ok) throw new Error('删除失败');

        const result = await res.json();
        if (result.success) {
            if (index === currentPlayingIndex && currentPlayer) {
                currentPlayer.pause();
                currentPlayer = null;
                currentPlayingIndex = -1;
            }
            showSuccessMessage('音频已从云端删除');
            await fetchAudioList();
            // 如果正在搜索，重新过滤一次
            if (document.getElementById('searchInput').value) {
                handleSearch();
            }
        }
    } catch (e) {
        console.error('删除出错:', e);
        alert('删除失败');
    }
}

function togglePlay(index) {
    const audio = filteredFiles[index];
    
    if (currentPlayer && currentPlayingIndex === index) {
        if (!currentPlayer.paused) {
            currentPlayer.pause();
        } else {
            currentPlayer.play();
        }
        renderAudioList();
        return;
    }
    
    if (currentPlayer) {
        currentPlayer.pause();
    }
    
    // 使用 Worker 的 /url 接口获取播放地址
    const audioUrl = `${WORKER_URL}/url?key=${encodeURIComponent(audio.name)}`;
    currentPlayer = new Audio(audioUrl);
    
    currentPlayer.play().catch((err) => {
        console.error('播放失败:', err);
        alert('无法播放音频，可能是文件链接失效或 Worker 权限问题。');
        currentPlayer = null;
        currentPlayingIndex = -1;
        renderAudioList();
    });
    
    currentPlayer.addEventListener('ended', function() {
        currentPlayingIndex = -1;
        currentPlayer = null;
        renderAudioList();
    });
    
    currentPlayingIndex = index;
    renderAudioList();
}

function renderAudioList() {
    const audioList = document.getElementById('audioList');
    if (filteredFiles.length === 0) {
        audioList.innerHTML = '<p style="color: rgba(255,255,255,0.6); text-align: center; margin-top: 50px;">未找到匹配的音频文件</p>';
        return;
    }

    let html = '';
    // 计算起始序号
    const startIndex = (currentPage - 1) * pageSize;

    for (let i = 0; i < filteredFiles.length; i++) {
        const audio = filteredFiles[i];
        const isPlaying = currentPlayingIndex === i && currentPlayer && !currentPlayer.paused;
        const isPaused = currentPlayingIndex === i && currentPlayer && currentPlayer.paused;
        let playBtnText = isPlaying ? '⏸ 暂停' : (isPaused ? '▶ 继续' : '▶ 播放');
        
        html += `
            <div class="audio-item">
                <div class="audio-info">
                    <div class="audio-title"><span style="color:#ff4d6d;font-weight:bold;">${startIndex + i + 1}.</span> 🎵 ${audio.displayName}</div>
                    <div class="audio-size">${audio.size} &nbsp;|&nbsp; 上传时间：${audio.uploadedFormatted}</div>
                </div>
                <div class="audio-actions">
                    <button class="play-btn" onclick="togglePlay(${i})">${playBtnText}</button>
                    <button class="delete-btn" onclick="deleteAudio(${i})">🗑️ 删除</button>
                </div>
            </div>
        `;
    }

    // 如果当前页条数不足 pageSize，或者已经是最后一页，显示“没有更多了”
    if (filteredFiles.length < pageSize || currentPage === totalPages) {
        html += '<div class="no-more">没有更多了</div>';
    }

    audioList.innerHTML = html;
    // 列表更新后，滚动条回到顶部
    audioList.scrollTop = 0;
}

function showSuccessMessage(message) {
    const successMsg = document.getElementById('successMsg');
    successMsg.textContent = message;
    successMsg.style.display = 'block';

    setTimeout(() => {
        successMsg.style.display = 'none';
    }, 3000);
}

init();
</script>
</body>
</html>
